name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only read the repo. Prevents a compromised
# third-party action from using a write-scoped GITHUB_TOKEN to push to the
# repo or tamper with releases.
permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Run Go tests
        working-directory: go
        # -race: the teardown/reactor tests were written to stress register-vs-
        # teardown under the race detector (see node_gate_test.go); gate on it.
        run: go test -race -v -count=1 ./...

  android-build:
    name: Android cross-build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # Every ABI we ship. Nothing else in CI compiles for Android, so an
    # Android-only build break could otherwise reach a release unnoticed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            cc: aarch64-linux-android24-clang
          - goarch: amd64
            cc: x86_64-linux-android24-clang
          - goarch: arm
            cc: armv7a-linux-androideabi24-clang
          - goarch: '386'
            cc: i686-linux-android24-clang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      # Pin NDK 28.2 because its clang target triples are part of this matrix.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          # The action's repository cache uses one immutable key per NDK and
          # OS. A prior matrix run populated that key with an archive missing
          # bin/clang, so prefer a fresh, deterministic pinned-NDK install.
          local-cache: false
      - name: Build
        working-directory: go
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          CC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}"
          echo "CC=$CC"
          # Match hook/build.dart's shipped Android artifact, including cgo's
          # c-shared link step and the actual FFI entry point.
          CC="$CC" go build \
            -buildmode=c-shared \
            -tags 'ts_omit_listenrawdisco ts_omit_portmapper' \
            -o "/tmp/libtailscale-${GOARCH}.so" \
            ./cmd/dylib/main.go

  dart-tests:
    name: Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: dart pub get
      - name: Analyze
        run: dart analyze lib/ test/ hook/
      - name: Tests
        # Hosted Tailscale receipts are opt-in even when a developer or runner
        # happens to export credentials. Headscale has its own job below.
        # dart_test.yaml pins concurrency to 1 so native runtime tests don't
        # stomp per-process global state.
        run: dart test --exclude-tags live-tailscale

  e2e-tests:
    name: E2E (Headscale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: dart pub get
      - name: Run Headscale E2E and R8 receipts
        run: test/e2e/run_e2e.sh
