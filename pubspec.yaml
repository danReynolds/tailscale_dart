name: tailscale
description: Embed Tailscale userspace networking in any Dart or Flutter app. Join a tailnet, discover peers, and communicate over encrypted WireGuard tunnels — no Tailscale app required.
version: 0.8.1
repository: https://github.com/danReynolds/tailscale_dart
homepage: https://danreynolds.github.io/tailscale_dart/
issue_tracker: https://github.com/danReynolds/tailscale_dart/issues

topics:
  - tailscale
  - networking
  - vpn
  - wireguard
  - flutter

platforms:
  android:
  ios:
  linux:
  macos:

environment:
  sdk: ^3.12.0

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.0
  hooks: ">=1.0.0 <3.0.0"
  http: ^1.2.0
  keybay: ^0.1.0
  meta: ^1.16.0
  path: ^1.9.0

hooks:
  hooks: ^1.0.0
  code_assets: ^1.0.0
  path: ^1.9.0

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  shelf: ^1.4.2
  tailscale_profile_harness:
    path: benchmark/profile_harness
  test: ^1.31.1
